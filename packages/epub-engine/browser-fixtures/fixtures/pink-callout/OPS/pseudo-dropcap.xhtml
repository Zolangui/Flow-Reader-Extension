<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Unreadable authored drop cap</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        color: #f8fafc;
      }
      body {
        padding: 32px;
        font: 20px/1.6 Georgia, serif;
      }
      p::first-letter {
        color: #111827;
        font-size: 3em;
      }
    </style>
  </head>
  <body>
    <p id="pseudo-dropcap-prose">
      This authored first letter is deliberately unreadable on the dark reader
      canvas and must remain declared debt.
    </p>
  </body>
</html>
